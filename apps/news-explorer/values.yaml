image:
  repository: ghcr.io/khainouski/news-explorer
  # Placeholder default — never left as "latest" for a real deployment. The Argo CD Application
  # (argocd/applications/news-explorer.yaml, once set up) overrides this with an actual
  # sha-<commit> from GHCR; until then, pass --set image.tag=sha-<commit> to helm directly.
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1 # single small dev droplet — bump per-environment once that changes

resources:
  # 32Mi limit OOMKilled the pod under load-test traffic (news-explorer-client at a few hundred
  # req/s) - concurrent request goroutines plus OTel's in-memory span buffering don't fit in that
  # little. Node has plenty of headroom (~4Gi free), so give it real room, same fix as Tempo's own
  # OOM earlier (platform/monitoring/tempo-values.yaml).
  requests: # guaranteed
    cpu: 100m
    memory: 32Mi
  limits: # ceiling
    cpu: 200m
    memory: 256Mi

sync:
  # Hourly, on the hour. Independent of the in-process fallback scheduler's 30min interval
  # (internal/background/sync, syncInterval in internal/app/app.go) - that goroutine is removed
  # once this CronJob is confirmed running, so the two never need to match.
  schedule: "0 * * * *"

otel:
  # Tempo's OTLP/gRPC receiver (platform/monitoring/tempo-values.yaml). Empty disables tracing
  # (app falls back to a no-op tracer) - harmless if Tempo isn't deployed yet, safe to leave on.
  endpoint: "tempo.monitoring.svc.cluster.local:4317"

postgres:
  # Same DB as platform/postgresql/postgresql-values.yaml (auth.username/database). Service is in
  # the "database" namespace; Secrets can't be referenced cross-namespace, so the password lives
  # in a Secret created by hand in *this* release's namespace (same pattern as Grafana's
  # grafana-admin-credentials - see platform/monitoring/grafana-values.yaml):
  #   kubectl create secret generic news-explorer-postgres-credentials -n apps \
  #     --from-literal=password='<same password as the "password" key in secret/postgresql -n database>'
  host: postgresql.database.svc.cluster.local
  port: "5432"
  dbName: news_explorer
  user: news_explorer
  existingSecret: news-explorer-postgres-credentials
  secretPasswordKey: password

service:
  port: 8080

ingress:
  enabled: true
  # Empty matches any Host header — fine while this is the only app behind the Ingress
  # controller. Set explicitly (e.g. "goskills.xyz") once more Ingresses share the same
  # Traefik instance and could otherwise collide.
  host: ""
  path: /
  tls:
    # Requires ingress.host to be set (cert-manager needs a concrete hostname) - safe default off.
    enabled: false
    issuer: letsencrypt-prod
