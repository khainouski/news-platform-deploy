apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "news-explorer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "news-explorer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "news-explorer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "news-explorer.selectorLabels" . | nindent 8 }}
      annotations:
        # Picked up by the bare prometheus-community/prometheus chart's default kubernetes-pods
        # scrape job (annotation-based discovery, no ServiceMonitor CRD/operator needed).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: news-explorer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: POSTGRES_DB_NAME
              value: {{ .Values.postgres.dbName | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.secretPasswordKey }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe: # is the pod alive
            httpGet:
              path: /live
              port: 8080
            failureThreshold: 3
            periodSeconds: 15
          readinessProbe: # is the pod ready for traffic
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 15
