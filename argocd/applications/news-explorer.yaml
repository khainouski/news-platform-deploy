apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: news-explorer
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/khainouski/news-platform-deploy.git
    targetRevision: main
    path: apps/news-explorer
    helm:
      values: |
        image:
          tag: "sha-40fd049"
        ingress:
          host: goskills.xyz
          tls:
            enabled: true
            # Verify with staging first (untrusted cert, no rate-limit risk), then switch to
            # letsencrypt-prod once `kubectl describe certificate` confirms Ready=True.
            issuer: letsencrypt-staging

  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
