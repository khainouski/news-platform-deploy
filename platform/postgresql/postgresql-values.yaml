# Bitnami stopped publishing versioned tags on the free tier of bitnami/postgresql (only
# "latest" + digests remain; the versioned bitnamilegacy/postgresql mirror is frozen on an older
# major and gets no security patches). Pinning by digest is the only way left to get a fixed,
# reproducible image instead of a floating "latest" - bump this manually every so often to pick
# up patches, same tradeoff as any unpinned base image.
image:
  digest: "sha256:03a2fc05c3b71a6fcc2e49c3f55f79767ca3bf32e6aa9b5dddc7901e02ffb923"

auth:
  username: news_explorer
  database: news_explorer
  # auth.password/auth.postgresPassword left unset on purpose - but letting the chart generate its
  # own random Secret (the old comment here, wrongly assuming it was the same safe pattern as
  # argocd-initial-admin-secret) actively broke this: Argo CD renders via `helm template` without
  # live cluster access, so its `lookup`-based "keep the existing password" guard always sees
  # nothing and mints a *new* random password into the Secret on every sync/selfHeal - while
  # Postgres itself only sets the password once, at initdb, off whatever was mounted at that
  # moment. Secret and real DB password silently diverge (hit this for real - a resync overwrote
  # it under an hour after cluster creation, before anything had even used it). existingSecret
  # points at a Secret cloud-init creates once at first boot, before Argo CD ever syncs this chart
  # - same fix as Grafana's admin.existingSecret. Key names match the chart's own defaults
  # (auth.secretKeys.adminPasswordKey/userPasswordKey), so no override needed there.
  existingSecret: postgresql-credentials

architecture: standalone

primary:
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi # was 256Mi - live usage was only ~36Mi, but Postgres spikes under
      # migrations/vacuum/connection bursts, so the low idle number understates real headroom needed
