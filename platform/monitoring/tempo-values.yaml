tempo:
  resources:
    # 256Mi limit OOMKilled the pod (exit 137) seconds after startup, right when flushing a WAL
    # block to parquet - a memory-heavy step, made worse once metrics-generator (span-metrics/
    # local-blocks) was enabled. Node has plenty of headroom (~4Gi free), so give it real room.
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  metricsGenerator:
    enabled: true
    # Service's own port is 80 (-> targetPort 9090 on the pod), same off-by-port bug found
    # earlier on the Grafana datasource: hitting 9090 on the Service itself times out silently.
    remoteWriteUrl: "http://prometheus-server.monitoring.svc.cluster.local:80/api/v1/write"
    processor:
      local_blocks:
        filter_server_spans: false
        flush_to_storage: true
    storage:
      # PVC (persistence below) mounts at /var/tempo - keep the WAL there too, not the chart's
      # default /tmp/tempo, so it survives pod restarts.
      path: /var/tempo/generator/wal
    traces_storage:
      path: /var/tempo/generator/traces
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
          - local-blocks
        generate_native_histograms: both

persistence:
  enabled: true
  size: 5Gi
