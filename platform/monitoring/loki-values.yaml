# The chart's values.yaml documents "Monolithic" as the current name for this mode
# ("SingleBinary" listed as deprecated) - but templates/_helpers.tpl's
# loki.deployment.isSingleBinary only ever checks for the literal old string "SingleBinary". With
# "Monolithic" (the chart's own claimed default) that condition is always false, so the actual
# Loki server (the single-binary StatefulSet) never rendered at all - gateway/caches came up fine
# and looked healthy, but there was nothing behind the gateway, hence the 502s. Real chart bug
# (docs renamed ahead of code, not us doing something wrong) - use the string that's actually
# wired up.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  persistence:
    size: 10Gi

# deploymentMode: Monolithic uses singleBinary only, but the chart's own validation rejects
# nonzero replicas on write/read/backend (SimpleScalable-mode components) too, even though they
# don't get created in this mode - the chart default is replicas: 3 on all three. Must zero them
# explicitly or `helm template`/Argo CD sync fails outright.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

gateway:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi

# Chart defaults (chunksCache: 8192MB, resultsCache: 1024MB allocatedMemory) size these for a
# real production cluster - chunksCache alone would request ~9.8GB (allocatedMemory * 1.2),
# more than this whole droplet has, and the pod sits Pending forever. Near-zero traffic here, so
# tiny caches are plenty.
chunksCache:
  allocatedMemory: 256

resultsCache:
  allocatedMemory: 128

test:
  enabled: false
