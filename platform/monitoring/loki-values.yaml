loki:
  auth_enabled: false
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  persistence:
    size: 10Gi

# deploymentMode: Monolithic uses singleBinary only, but the chart's own validation rejects
# nonzero replicas on write/read/backend (SimpleScalable-mode components) too, even though they
# don't get created in this mode - the chart default is replicas: 3 on all three. Must zero them
# explicitly or `helm template`/Argo CD sync fails outright.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

gateway:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi

test:
  enabled: false
