admin:
  # The chart's own random-password generation relies on Helm `lookup` to reuse an existing
  # secret's value across upgrades - Argo CD renders via `helm template` without live cluster
  # access, so `lookup` always comes back empty and a *new* random password got minted on every
  # sync, while Grafana's actual DB (persisted on the PVC) kept the very first one. Result: the
  # Secret and the real working password silently diverged. Fixed by pointing at a Secret we
  # manage ourselves (created once, out of band - not in git):
  #   kubectl create secret generic grafana-admin-credentials -n monitoring \
  #     --from-literal=admin-user=admin --from-literal=admin-password='<password>'
  existingSecret: grafana-admin-credentials

ingress:
  enabled: true
  hosts:
    - grafana.goskills.xyz
  path: /
  annotations:
    # Verified working on letsencrypt-staging first (see plan.md), now on prod.
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: grafana-tls
      hosts:
        - grafana.goskills.xyz

env:
  GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor traceQLStreaming metricsSummary"
  # Sidecar drops provisioned dashboards in /tmp/dashboards (sidecar.dashboards.folder default),
  # not /var/lib/grafana/dashboards like the docker-compose bind mount.
  GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /tmp/dashboards/http-red.json

persistence:
  enabled: true
  size: 2Gi

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    # 256Mi OOMKilled Grafana 13.1.2 under normal use (bleve search indexing, k8s-based
    # provisioning, zanzana authz all add up) - actual usage was already ~286Mi at idle.
    memory: 512Mi

sidecar:
  dashboards:
    enabled: true

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        # Service's own port is 80 (-> targetPort 9090 on the pod) - not 9090 itself. Wrong port
        # here doesn't error, it just hangs: connecting to a port a Service doesn't expose has no
        # iptables/ipvs rule to hit anything, so the TCP SYN goes nowhere and every query times
        # out after Grafana's 10s client timeout ("i/o timeout", not "connection refused").
        url: http://prometheus-server.monitoring.svc.cluster.local:80
        isDefault: true

      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        jsonData:
          derivedFields:
            - name: Tempo
              datasourceUid: tempo
              matcherRegex: '"trace_id":"(\w+)"'
              url: '$${__value.raw}'
              urlDisplayLabel: 'View Trace'

      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: 'loki'
            customQuery: true
            query: '{namespace="apps"} | json | trace_id="$${__trace.traceId}"'
            spanStartTimeShift: '-5m'
            spanEndTimeShift: '5m'
